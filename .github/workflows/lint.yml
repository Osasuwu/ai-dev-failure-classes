name: Lint

# `ruff check` and `ruff format --check` over every Python file, on every PR and every push to
# main. No paths filter: `ruff` is a required check on main, so the job must always run and report.
# The ruff version comes from .github/ruff-requirements.txt, the only place it is pinned.
# The one formatter-only commit is listed in .git-blame-ignore-revs; to fix a red Format step,
# run `ruff format .` at the pinned version.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ruff at the pinned version
        run: pip install -r .github/ruff-requirements.txt
      - name: Lint
        run: ruff check .
      - name: Format
        # Runs even when Lint fails, so one run reports both.
        if: success() || failure()
        run: ruff format --check .
