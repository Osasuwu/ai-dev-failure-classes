name: Link check

# Runs scripts/check_links.py on the markdown files a PR adds or changes (#264, ADR-0004
# decision 19). The script keeps the ones under the shared path definition
# (.github/hold-paths.json) and reports every link in them as alive, dead or not verified. It
# fails on dead only; a link it could not judge (a login, a bot check, a rate limit) is not
# verified and does not fail the job. It checks that a link resolves, never what the page says.
# Optional: not a required check on main. No schedule: the weekly quote re-check stays the only
# cron.

on:
  pull_request:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check links in changed docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=d "$BASE_SHA"...HEAD -- '*.md')
          python scripts/check_links.py "${changed[@]}"
